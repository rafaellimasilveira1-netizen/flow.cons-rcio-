<title>Painel Flow Consórcio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: faixa larga, abas sublinhadas, cartões grandes sem borda, números de 38px, tabelas para listas (mesma família do painel do seguro, em navy e ouro) */
:root{--bg:#F1F3F6;--surface:#FFFFFF;--ink:#0F1B26;--muted:#5B6975;--line:#E3E7EC;--soft:#EDF0F4;--accent:#0E3A5C;--accent-ink:#FFFFFF;--gold:#B2852B;--field:#C7CFD7;--ok:#1B7A46;--ok-bg:#DCF1E3;--bad:#B0342B;--bad-bg:#F9DDD9;--warn:#8F6208;--warn-bg:#F9EDCB;--font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1219;--surface:#121D27;--ink:#E7EEF3;--muted:#93A2AF;--line:#1F2C37;--soft:#192631;--accent:#D4AE62;--accent-ink:#1A1305;--gold:#D4AE62;--field:#34434F;--ok:#62CF8D;--ok-bg:#173826;--bad:#F0877D;--bad-bg:#40201C;--warn:#E5B955;--warn-bg:#3A2E10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1219;--surface:#121D27;--ink:#E7EEF3;--muted:#93A2AF;--line:#1F2C37;--soft:#192631;--accent:#D4AE62;--accent-ink:#1A1305;--gold:#D4AE62;--field:#34434F;--ok:#62CF8D;--ok-bg:#173826;--bad:#F0877D;--bad-bg:#40201C;--warn:#E5B955;--warn-bg:#3A2E10;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;padding-block:24px 72px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.logo{font-weight:700;letter-spacing:.22em;font-size:15px;color:var(--accent)}.logo small{font-weight:600;letter-spacing:.3em;font-size:11px;color:var(--muted);margin-left:10px}
h1{font-size:30px;line-height:1.12;margin:6px 0 0;font-weight:700;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label.field{display:flex;flex-direction:column;gap:5px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0;flex:1 1 170px}
label.field.w{flex:2 1 280px}label.field.n{flex:0 1 190px}
label.field b{color:var(--bad)}
input,textarea,select{font:inherit;font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--surface);border:1px solid var(--field);border-radius:6px;padding:9px 11px;min-height:42px;width:100%;min-width:0}
textarea{resize:vertical}
input:focus-visible,button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:6px;border:1px solid var(--field);background:var(--surface);color:var(--ink);padding:7px 14px;min-height:38px}
button:hover{border-color:var(--accent)}button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button.sm{min-height:32px;padding:4px 10px;font-size:13px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:10px 18px;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{display:flex;flex-direction:column;gap:24px}
.demo{background:var(--warn-bg);color:var(--warn);font-size:13px;padding:7px 14px;border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.stat{background:var(--surface);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stat .k{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}.stat .v small{font-size:15px;font-weight:500;color:var(--muted)}
.stat .n{font-size:14px;line-height:1.5;color:var(--muted)}
.c-g{color:var(--ok)}.c-r{color:var(--bad)}.c-y{color:var(--warn)}
.meter{position:relative;height:8px;border-radius:4px;background:var(--soft)}.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}.meter b{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink)}
.sec{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 -6px}
.panel{background:var(--surface);border-radius:12px;overflow:hidden}
.panel>h2{margin:0;padding:22px 24px 10px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel>.body{padding:8px 24px 24px;display:flex;flex-direction:column;gap:16px}
.grid{display:flex;flex-wrap:wrap;gap:16px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-block:8px;white-space:nowrap}
th:first-child,td:first-child{padding-left:24px}th:last-child,td:last-child{padding-right:24px}tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}td.act{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;border-bottom:0}tr.x td{background:var(--soft);padding:16px 24px}
.name{font-weight:600}.m{color:var(--muted);font-size:13px}.hora{font-weight:700;font-size:17px}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:13px;font-weight:700;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.no{background:var(--bad-bg);color:var(--bad)}.pill.gold{background:var(--warn-bg);color:var(--warn)}
.msg{border-radius:10px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:15px}.msg span{flex:1 1 240px}.msg.i{background:var(--warn-bg);color:var(--warn)}.msg.e{background:var(--bad-bg);color:var(--bad)}.msg.g{background:var(--ok-bg);color:var(--ok)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}.slots button{font-variant-numeric:tabular-nums;min-height:42px}.slots button.x{opacity:.3;text-decoration:line-through}.slots button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.empty{padding:24px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink);cursor:pointer;min-height:42px}.chk input{width:18px;height:18px;min-height:0;accent-color:var(--accent)}
.funil{display:grid;grid-template-columns:repeat(9,minmax(118px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}.funil .stat{padding:16px 14px;gap:6px}.funil .stat .v{font-size:30px}.funil .stat .k{font-size:11px;letter-spacing:.05em}.funil .stat .n{font-size:12.5px}
.per{position:relative;flex:0 1 auto}.per>button{min-height:42px;min-width:240px;text-align:left;display:flex;justify-content:space-between;gap:12px;font-weight:500}
.cal{position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:16px;width:min(330px,88vw)}
.cal .pr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.cal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.cal .g span{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cal .g button{border:0;background:transparent;min-height:36px;padding:0;border-radius:6px;font-weight:500;font-variant-numeric:tabular-nums}.cal .g button.o{color:var(--muted);opacity:.5}.cal .g button.in{background:var(--soft)}.cal .g button.ed{background:var(--accent);color:var(--accent-ink)}
.ovl{position:fixed;inset:0;z-index:15}
@media (max-width:640px){body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.stat .v{font-size:32px}h1{font-size:25px}}
</style>
<div class="wrap">
<header><div><div class="logo">FLOW<small>CONSÓRCIO</small></div><h1 id="h1">Painel</h1><p class="sub" id="sub"></p></div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="app"></main>
</div>
<script>
(function(){
var TZ='America/Sao_Paulo';
function agoraStr(){return new Date().toLocaleString('sv-SE',{timeZone:TZ}).slice(0,16);}
function hojeStr(){return agoraStr().slice(0,10);}
function addDias(d,n){var x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);}
function hm(t){return String(t).slice(11,16);}
function mins(h){var p=h.split(':');return p[0]*60+ +p[1];}
function fmt(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function fone(s){return String(s||'').replace(/\D/g,'');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function dow(d){return new Date(d+'T12:00:00Z').getUTCDay();}
function fmtData(d){var n=['dom','seg','ter','qua','qui','sex','sáb'];return n[dow(d)]+' '+d.slice(8,10)+'/'+d.slice(5,7);}
function fm(n){return (n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function brl(n){return 'R$ '+fm(n);}
function num(s){var v=String(s||'').replace(/\./g,'').replace(',','.').replace(/[^\d.]/g,'');return v?parseFloat(v):0;}
var ETAPAS=['Fechado','Aguardando documentação','Aguardando pagamento','Pago'];
function trava(c){return ETAPAS.indexOf(c.Status)>=0;}
var FIN=['Imóvel','Automóveis','Agro','Capital de giro','Construção','Quitar financiamento'];
var FONTE=['Tráfego','Repescagem','Discador','Indicação','Instagram','Cliente carteira','Orgânico'];
var ST=['Novo','Reunião agendada','No-show','Negociação','Fechado','Aguardando documentação','Aguardando pagamento','Pago','Perdido'];
var K='';try{K=new URLSearchParams(location.search).get('k')||sessionStorage.getItem('k')||'';if(K)sessionStorage.setItem('k',K);}catch(e){}
var H=hojeStr(),amanha=addDias(H,1);
var closers=[],pessoas=[],clientes=[],agenda=[],disp=[],eu={nome:'',perfil:'sdr'},busy=false;
function nrm(s){return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
function setPeriodo(p){var m=H.slice(0,8)+'01',w=dow(H)||7;if(p==='hoje'){S.de=H;S.ate=H;}else if(p==='semana'){S.de=addDias(H,-(w-1));S.ate=addDias(H,7-w);}else if(p==='mes'){S.de=m;var d=m;while(addDias(d,1).slice(0,7)===H.slice(0,7))d=addDias(d,1);S.ate=d;}else{S.de='2000-01-01';S.ate='2100-12-31';}S.preset=p;}
function defCloser(){var n=closers.map(function(c){return c.nome;});return eu.perfil!=='sdr'&&n.indexOf(eu.nome)>=0?eu.nome:(n[0]||'');}
var S={meta:{},metaProsp:{},metaCred:0,superCred:0,folgas:[],reag:null,rd:'',rs:'',res:null,rv:'',pt:'',de:'',ate:'',preset:'',tSdr:true,tProp:true,cal:null,pp:'',ed:false,e:null,tab:'painel',pessoa:'',closer:'',data:H,msg:null,q:'',ff:'',fq:'',fs:'',cli:null,
 n:{tel:'',nome:'',sexo:'',tf:'',fin:'',fonte:'',cred:'',ent:'',par:'',obs:'',sel:''}};
setPeriodo('mes');window.setPeriodo=setPeriodo;window.S=S;window.render=function(){render();};
function achaCli(t){return clientes.filter(function(c){return c.Telefone===t;})[0];}
function nomeDe(t){var c=achaCli(fone(t));return c?c.Nome:(t||'Horário ocupado');}
function nomesPessoas(){return pessoas.map(function(p){return p.nome;});}
function slotsDia(cl,d){var w=['dom','seg','ter','qua','qui','sex','sab'][dow(d)],jan=[],blq=[];
 disp.forEach(function(x){if(nrm(x.Closer)!==nrm(cl)||nrm(x.Ativo)==='nao'||nrm(x.Ativo)==='n')return;var a=mins(x.Ini),b=mins(x.Fim),t=nrm(x.Tipo);if(t==='semanal'&&nrm(x.Dia).slice(0,3)===w)jan.push([a,b]);else if(t==='extra'&&x.Data===d)jan.push([a,b]);else if(t==='bloqueio'&&x.Data===d)blq.push([a,b]);});
 var out={};jan.forEach(function(j){for(var t=j[0];t+30<=j[1];t+=30)if(!blq.some(function(q){return t<q[1]&&t+30>q[0];}))out[t]=1;});return Object.keys(out).map(Number).sort(function(a,b){return a-b;}).map(fmt);}
function livre(cl,d,h){var ini=d+' '+h;return ini>agoraStr()&&!agenda.some(function(a){return a.Status==='Agendada'&&a.Closer===cl&&a.ini===ini;});}
function aviso(t,tipo,acao){S.msg={t:t,tipo:tipo||'i',acao:acao||null};render();window.scrollTo(0,0);}
/* ---- conversa com o servidor ---- */
function api(path,body){return fetch('/.netlify/functions/'+path,{method:body?'POST':'GET',headers:{'x-acesso':K,'content-type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'}).then(function(r){return r.json().then(function(j){j._s=r.status;return j;});}).catch(function(){return{erro:'Sem conexão. Tente de novo.',_s:0};});}
function aplicar(j){eu=j.eu;closers=j.closers;pessoas=j.pessoas;clientes=j.clientes;agenda=j.agenda;disp=j.disp;S.meta=j.config.meta;S.metaProsp=j.config.metaProsp||{};S.metaCred=j.config.metaCred;S.superCred=j.config.superCred;S.folgas=j.config.folgas;if(!S.closer||nomesClosers().indexOf(S.closer)<0)S.closer=defCloser();}
function nomesClosers(){return closers.map(function(c){return c.nome;});}
function carregar(){return api('dados').then(function(j){if(j.erro){return j;}aplicar(j);return j;});}
function fatal(msg){document.getElementById('tabs').innerHTML='';document.getElementById('h1').textContent='Painel';document.getElementById('sub').textContent='';document.getElementById('app').innerHTML='<div class="msg e"><span>'+esc(msg)+'</span></div>';}
/* executa uma ação; depois recarrega os dados e mostra a mensagem */
function exec(body,depois){if(busy)return;busy=true;api('acao',body).then(function(j){busy=false;
  if(j._s===409&&j.aviso&&!body.forcar){aviso(j.erro,'i',function(){body.forcar=true;exec(body,depois);});return;}
  if(j.erro){aviso(j.erro,'e');return;}
  carregar().then(function(d){if(d.erro){aviso(d.erro,'e');return;}if(depois)depois(j);aviso(j.msg||'Pronto.','g');});});}
window.ir=function(t){S.tab=t;S.msg=null;render();};
window.sim=function(){var f=S.msg.acao;S.msg=null;f();};window.nao=function(){S.msg=null;render();};
window.setp=function(k,v){S[k]=v;render();};
window.canc=function(id){aviso('Cancelar essa reunião?','i',function(){exec({acao:'cancelar',id:id});});};
window.conf=function(id,tipo){var a=agenda.filter(function(x){return x.ID===id;})[0],lk=wa(a,tipo==='manha'?'manha':'20'),tel=(achaCli(a.Telefone)||{}).Tel||'?';
 var ok=function(){api('acao',{acao:'confirmar',id:id,tipo:tipo}).then(function(j){carregar().then(function(){if(j.erro)aviso(j.erro,'e');else aviso('Link copiado com a mensagem pronta. Cole no WhatsApp do número certo (Tel '+tel+').','g');});});};
 try{navigator.clipboard.writeText(lk).then(ok,function(){fb(lk,ok);});}catch(e){fb(lk,ok);}};
function fb(t,ok){var x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();var r=false;try{r=document.execCommand('copy');}catch(e){}document.body.removeChild(x);if(r)ok();else aviso('Não consegui copiar. Link: '+t,'e');}
window.ver=function(t){S.cli=achaCli(t);S.tab='clientes';render();window.scrollTo(0,0);};
/* resultado com parecer obrigatório */
window.abrirRes=function(id){S.res=S.res===id?null:id;S.reag=null;S.rv='';S.pt='';render();};
window.salvarRes=function(id){if(!S.rv)return aviso('Escolha o resultado da reunião.','e');if(S.pt.trim().length<5)return aviso('O parecer da closer é obrigatório. Escreva o que aconteceu na reunião.','e');
 var rv=S.rv,pt=S.pt.trim(),go=function(){exec({acao:'resultado',id:id,resultado:rv,parecer:pt},function(){S.res=null;});};
 if(rv==='fechado')aviso('Venda fechada: o cliente vai pra Aguardando documentação e não dá mais pra agendar de novo. Confirma?','i',go);else go();};
window.etapa=function(t,v){if(!v)return;exec({acao:'etapa',telefone:t,etapa:v});};
window.reag=function(id){S.reag=S.reag===id?null:id;S.res=null;S.rd=addDias(H,1);S.rs='';render();};
window.reagOk=function(id){if(!S.rs)return aviso('Escolha o novo horário.','e');exec({acao:'reagendar',id:id,inicio:S.rd+'T'+S.rs},function(){S.reag=null;});};
window.setMeta=function(p,v){var m={};m[p]=v;exec({acao:'salvarConfig',meta:m});};
window.setProsp=function(p,v){var m={};m[p]=v;exec({acao:'salvarConfig',metaProsp:m});};
window.setCred=function(k,v){var b={acao:'salvarConfig'};b[k]=v;exec(b);};
window.setFolgas=function(v){exec({acao:'salvarConfig',folgas:v.split(/[\s,;]+/).filter(function(x){return /^\d{4}-\d{2}-\d{2}$/.test(x);})});};
window.setMeet=function(nome,v){var m={};m[nome]=v;exec({acao:'salvarConfig',meets:m});};
/* cadastro + agenda numa tela */
function mask(v){var raw=String(v).replace(/\D/g,''),d=raw.replace(/^0+/,'');return d?fm(parseInt(d,10)/100):(raw?'0,00':'');}
window.nv=function(k,v){S.n[k]=v;};window.mk=function(el,k){el.value=mask(el.value);S.n[k]=el.value;};window.mkc=function(el){el.value=mask(el.value);};
window.nvTel=function(v){S.n.tel=v;var t=fone(v);if(t.length>=10&&t.length<=11){var c=achaCli(t);if(c&&S.n._pre!==t){S.n._pre=t;var n=S.n;n.nome=c.Nome;n.sexo=c.Sexo;n.tf=c.Tel||'';n.fin=c.Finalidade;n.fonte=c.Fonte;n.cred=c.Credito?fm(c.Credito):'';n.ent=fm(c.Entrada);n.par=fm(c.Parcela);n.obs=c.Obs;render();}else if(!c&&S.n._pre){S.n._pre='';render();}}};
window.nvSlot=function(h){S.n.sel=h;render();};
window.salvar=function(){var n=S.n,t=fone(n.tel),erro=null;
 if(t.length<10||t.length>11)erro='Telefone inválido. Use DDD + número.';else erro=erroCampos(n);
 if(erro)return aviso(erro,'e');
 exec({acao:'salvarCliente',telefone:t,nome:n.nome,sexo:n.sexo,tf:n.tf,fin:n.fin,fonte:n.fonte,cred:n.cred,ent:n.ent,par:n.par,obs:n.obs,closer:S.closer,etapa:n.sel?'':(n.etapa||''),inicio:n.sel?S.data+'T'+n.sel:''},function(r){S.n={tel:'',nome:'',sexo:'',tf:'',fin:'',fonte:'',cred:'',ent:'',par:'',obs:'',sel:'',etapa:''};S.tab=r.agendou?'agenda':'clientes';S.cli=null;});};
window.ev=function(k,v){S.e[k]=v;};window.mke=function(el,k){el.value=mask(el.value);S.e[k]=el.value;};
